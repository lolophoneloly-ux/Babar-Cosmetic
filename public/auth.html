<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up / Login — Babar Cosmetics</title>
<meta name="description" content="Create an account or log in to Babar Cosmetics." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<style>
  .auth-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(120% 120% at 50% 0%, var(--wine-800) 0%, var(--wine-900) 45%, var(--wine-950) 100%);
    padding: 40px 20px;
    position: relative;
    overflow: hidden;
  }
  .auth-page .hero__blob { z-index: 0; }
  .auth-card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 440px;
    background: rgba(251,243,236,0.06);
    border: 1px solid rgba(251,243,236,0.14);
    border-radius: var(--radius-lg);
    padding: clamp(28px, 5vw, 44px);
    backdrop-filter: blur(6px);
  }
  .auth-card__logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 28px;
  }
  .auth-card__logo .nav__logo-main { color: var(--ivory); font-size: 1.8rem; }
  .auth-card__logo .nav__logo-sub { color: var(--gold-light); margin-top: 4px; }

  .auth-tabs {
    display: flex;
    background: rgba(251,243,236,0.08);
    border-radius: 999px;
    padding: 4px;
    margin-bottom: 28px;
  }
  .auth-tab {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.9rem;
    color: rgba(251,243,236,0.6);
    background: none;
    border: none;
    transition: background .3s, color .3s;
  }
  .auth-tab.is-active {
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    color: var(--wine-950);
  }

  .auth-form { display: none; flex-direction: column; gap: 16px; }
  .auth-form.is-active { display: flex; }

  .auth-form h2 {
    font-family: var(--font-display);
    color: var(--ivory);
    font-weight: 600;
    margin: 0 0 4px;
    font-size: 1.5rem;
  }
  .auth-form p.auth-sub {
    color: rgba(251,243,236,0.65);
    font-size: 0.9rem;
    margin: 0 0 8px;
  }
  .auth-form label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.85rem;
    font-weight: 700;
    color: rgba(251,243,236,0.8);
  }
  .auth-form input {
    padding: 13px 16px;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(251,243,236,0.25);
    background: rgba(251,243,236,0.06);
    color: var(--ivory);
    font-family: var(--font-body);
    font-size: 0.95rem;
  }
  .auth-form input::placeholder { color: rgba(251,243,236,0.35); }
  .auth-form .btn { width: 100%; justify-content: center; margin-top: 6px; }

  .auth-msg {
    min-height: 1.4em;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--gold-light);
    text-align: center;
  }
  .auth-msg.error { color: #E9A0A0; }

  .auth-back {
    display: block;
    text-align: center;
    margin-top: 24px;
    font-size: 0.85rem;
    color: rgba(251,243,236,0.55);
  }
  .auth-back:hover { color: var(--gold-light); }

  /* ===== Girl-pulling-card illustration ===== */
  .auth-scene {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 0;
    max-width: 920px;
    width: 100%;
  }
  .auth-illustration {
    width: clamp(170px, 23vw, 260px);
    height: auto;
    flex-shrink: 0;
    margin-right: clamp(-24px, -2.5vw, -8px);
    margin-bottom: 18px;
    filter: drop-shadow(0 14px 18px rgba(0,0,0,0.28));
    animation: girlBob 1.1s cubic-bezier(.45,0,.55,1) infinite;
  }
  @media (max-width: 880px) {
    .auth-scene { flex-direction: column; align-items: center; gap: 2px; }
    .auth-illustration { width: 150px; margin: 0; }
    .rope { display: none; }
  }

  .thigh-back, .thigh-front, .arm-back, .arm-front, .ponytail, .shadow-ellipse {
    transform-box: fill-box;
    transform-origin: 50% 0%;
  }
  .shin-back, .shin-front { transform-box: fill-box; transform-origin: 50% 0%; }

  .thigh-back  { animation: thighBack 1.1s cubic-bezier(.45,0,.55,1) infinite; }
  .thigh-front { animation: thighFront 1.1s cubic-bezier(.45,0,.55,1) infinite; }
  .shin-back   { animation: shinBack 1.1s cubic-bezier(.45,0,.55,1) infinite; }
  .shin-front  { animation: shinFront 1.1s cubic-bezier(.45,0,.55,1) infinite; }
  .arm-front   { animation: thighFront 1.1s cubic-bezier(.45,0,.55,1) infinite; }
  .arm-back    { animation: armPull 0.55s ease-in-out infinite; }
  .ponytail    { animation: ponytailSway 1.1s ease-in-out infinite; }
  .rope        { animation: ropePull 0.6s linear infinite; }
  .shadow-ellipse { animation: shadowPulse 1.1s cubic-bezier(.45,0,.55,1) infinite; }
  .dust-1 { transform-box: fill-box; transform-origin: 50% 50%; animation: dustPuff 1.1s ease-out infinite; }
  .dust-2 { transform-box: fill-box; transform-origin: 50% 50%; animation: dustPuff 1.1s ease-out infinite 0.55s; }

  @keyframes girlBob {
    0%, 100% { transform: translateY(0); }
    25% { transform: translateY(-6px); }
    50% { transform: translateY(0); }
    75% { transform: translateY(-6px); }
  }
  @keyframes thighBack {
    0%, 100% { transform: rotate(22deg); }
    50% { transform: rotate(-24deg); }
  }
  @keyframes thighFront {
    0%, 100% { transform: rotate(-24deg); }
    50% { transform: rotate(22deg); }
  }
  @keyframes shinBack {
    0%, 100% { transform: rotate(-18deg); }
    30% { transform: rotate(-4deg); }
    50% { transform: rotate(28deg); }
    80% { transform: rotate(-4deg); }
  }
  @keyframes shinFront {
    0%, 100% { transform: rotate(28deg); }
    30% { transform: rotate(-4deg); }
    50% { transform: rotate(-18deg); }
    80% { transform: rotate(-4deg); }
  }
  @keyframes armPull {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(5deg); }
  }
  @keyframes ponytailSway {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(10deg); }
  }
  @keyframes shadowPulse {
    0%, 100% { transform: scaleX(1); opacity: 0.35; }
    50% { transform: scaleX(0.82); opacity: 0.22; }
  }
  @keyframes ropePull {
    0% { stroke-dashoffset: 20; }
    100% { stroke-dashoffset: 0; }
  }
  @keyframes dustPuff {
    0% { opacity: 0; transform: scale(0.4) translateY(0); }
    25% { opacity: 0.5; }
    100% { opacity: 0; transform: scale(1.3) translateY(-10px); }
  }
  @keyframes cardDragIn {
    0% { transform: translateX(80px) rotate(-2deg); opacity: 0; }
    55% { transform: translateX(-10px) rotate(1deg); opacity: 1; }
    100% { transform: translateX(0) rotate(0deg); opacity: 1; }
  }
  .auth-card { animation: cardDragIn 1s cubic-bezier(.34,1.56,.64,1) both; }
</style>
</head>
<body>

<div class="auth-page">
  <div class="hero__blob hero__blob--a" aria-hidden="true"></div>
  <div class="hero__blob hero__blob--b" aria-hidden="true"></div>

  <div class="auth-scene">
    <svg class="auth-illustration" viewBox="0 0 260 340" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <ellipse class="shadow-ellipse" cx="128" cy="326" rx="62" ry="9" fill="#2A0712"/>

      <g class="dust dust-1"><circle cx="52" cy="306" r="6" fill="rgba(251,243,236,0.45)"/></g>
      <g class="dust dust-2"><circle cx="34" cy="313" r="4" fill="rgba(251,243,236,0.32)"/></g>

      <!-- back leg -->
      <g class="thigh-back">
        <path d="M120 246 L134 246 L127 288 L115 288 Z" fill="#3B0918"/>
        <g class="shin-back">
          <ellipse cx="121" cy="303" rx="15" ry="7.5" fill="#E4C77A"/>
          <rect x="116" y="286" width="11" height="16" rx="4" fill="#3B0918"/>
        </g>
      </g>

      <!-- front leg -->
      <g class="thigh-front">
        <path d="M132 246 L146 246 L153 288 L139 288 Z" fill="#55102A"/>
        <g class="shin-front">
          <ellipse cx="149" cy="303" rx="15" ry="7.5" fill="#C9A227"/>
          <rect x="140" y="286" width="11" height="16" rx="4" fill="#55102A"/>
        </g>
      </g>

      <!-- dress -->
      <path d="M104 150 Q130 135 156 150 L166 247 Q130 264 94 247 Z" fill="url(#dressGrad)"/>
      <path d="M99 190 Q130 202 161 190" stroke="url(#beltGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>

      <!-- front arm (swings) -->
      <g class="arm-front">
        <path d="M108 163 Q90 186 84 214" stroke="#F0C9A0" stroke-width="11" fill="none" stroke-linecap="round"/>
        <circle cx="84" cy="216" r="7" fill="#F0C9A0"/>
      </g>

      <!-- back arm (grips rope) -->
      <g class="arm-back">
        <path d="M152 163 Q178 174 195 194" stroke="#F0C9A0" stroke-width="11" fill="none" stroke-linecap="round"/>
        <circle cx="196" cy="196" r="7.5" fill="#F0C9A0"/>
      </g>

      <!-- ponytail (behind head, drawn first for layering then head on top) -->
      <g class="ponytail">
        <path d="M148 100 Q178 108 176 145 Q172 172 152 178 Q168 148 160 120 Q156 106 148 100 Z" fill="url(#hairGrad)"/>
      </g>

      <!-- head -->
      <circle cx="130" cy="120" r="27" fill="#F0C9A0"/>
      <ellipse cx="115" cy="132" rx="6" ry="4" fill="#E9A9A0" opacity="0.55"/>
      <ellipse cx="145" cy="132" rx="6" ry="4" fill="#E9A9A0" opacity="0.55"/>
      <path d="M102 116 Q98 82 130 79 Q162 82 158 116 Q159 96 130 94 Q101 96 102 116 Z" fill="url(#hairGrad)"/>
      <circle cx="121" cy="122" r="2.2" fill="#2A0712"/>
      <circle cx="139" cy="122" r="2.2" fill="#2A0712"/>
      <path d="M121 133 Q130 139 139 133" stroke="#2A0712" stroke-width="2.2" fill="none" stroke-linecap="round"/>

      <!-- rope from hand to card -->
      <path class="rope" d="M196 196 Q228 189 260 170" stroke="url(#ropeGrad)" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-dasharray="7 7"/>

      <defs>
        <linearGradient id="dressGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#832243"/>
          <stop offset="100%" stop-color="#3B0918"/>
        </linearGradient>
        <linearGradient id="hairGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#E4C77A"/>
          <stop offset="100%" stop-color="#B78D22"/>
        </linearGradient>
        <linearGradient id="beltGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#B78D22"/>
          <stop offset="50%" stop-color="#E4C77A"/>
          <stop offset="100%" stop-color="#B78D22"/>
        </linearGradient>
        <linearGradient id="ropeGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#B78D22"/>
          <stop offset="100%" stop-color="#E4C77A"/>
        </linearGradient>
      </defs>
    </svg>

  <div class="auth-card">
    <div class="auth-card__logo">
      <span class="nav__logo-main">Babar</span>
      <span class="nav__logo-sub">COSMETICS</span>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab is-active" id="tabSignup" type="button">Sign Up</button>
      <button class="auth-tab" id="tabLogin" type="button">Login</button>
    </div>

    <!-- Signup form -->
    <form class="auth-form is-active" id="signupForm">
      <h2>Create your account</h2>
      <p class="auth-sub">Join for early access to new shades and drops.</p>
      <label>
        Full Name
        <input type="text" name="name" placeholder="Ayesha Khan" required maxlength="100" />
      </label>
      <label>
        Email
        <input type="email" name="email" placeholder="you@example.com" required maxlength="200" />
      </label>
      <label>
        Password
        <input type="password" name="password" placeholder="At least 6 characters" required minlength="6" maxlength="100" />
      </label>
      <button type="submit" class="btn btn--gold">Sign Up</button>
      <p class="auth-msg" id="signupMsg" role="status"></p>
    </form>

    <!-- Login form -->
    <form class="auth-form" id="loginForm">
      <h2>Welcome back</h2>
      <p class="auth-sub">Log in to continue to Babar Cosmetics.</p>
      <label>
        Email
        <input type="email" name="email" placeholder="you@example.com" required maxlength="200" />
      </label>
      <label>
        Password
        <input type="password" name="password" placeholder="Your password" required maxlength="100" />
      </label>
      <button type="submit" class="btn btn--gold">Login</button>
      <p class="auth-msg" id="loginMsg" role="status"></p>
    </form>

    <a href="/" class="auth-back">← Back to home</a>
  </div>
  </div>
</div>

<script>
  const tabSignup = document.getElementById('tabSignup');
  const tabLogin = document.getElementById('tabLogin');
  const signupForm = document.getElementById('signupForm');
  const loginForm = document.getElementById('loginForm');

  function showTab(tab) {
    const isSignup = tab === 'signup';
    tabSignup.classList.toggle('is-active', isSignup);
    tabLogin.classList.toggle('is-active', !isSignup);
    signupForm.classList.toggle('is-active', isSignup);
    loginForm.classList.toggle('is-active', !isSignup);
  }
  tabSignup.addEventListener('click', () => showTab('signup'));
  tabLogin.addEventListener('click', () => showTab('login'));

  // If a redirect param exists, honor it after auth; else go home
  const params = new URLSearchParams(window.location.search);
  const redirectTo = params.get('redirect') || '/';
  if (params.get('mode') === 'login') showTab('login');

  async function handleAuthSubmit(form, url, msgEl) {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = form.querySelector('button[type="submit"]');
      const originalLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Please wait…';
      msgEl.textContent = '';
      msgEl.classList.remove('error');

      const payload = {};
      new FormData(form).forEach((v, k) => (payload[k] = v));

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        msgEl.textContent = data.message || data.error || '';
        if (data.success) {
          msgEl.classList.remove('error');
          setTimeout(() => (window.location.href = redirectTo), 500);
        } else {
          msgEl.classList.add('error');
        }
      } catch (err) {
        msgEl.textContent = 'Kuch ghalat ho gaya. Dobara koshish karein.';
        msgEl.classList.add('error');
      } finally {
        btn.disabled = false;
        btn.textContent = originalLabel;
      }
    });
  }

  handleAuthSubmit(signupForm, '/api/auth/signup', document.getElementById('signupMsg'));
  handleAuthSubmit(loginForm, '/api/auth/login', document.getElementById('loginMsg'));

  // If already logged in, skip straight to the site
  fetch('/api/auth/me', { credentials: 'same-origin' })
    .then((r) => (r.ok ? window.location.replace(redirectTo) : null))
    .catch(() => {});
</script>
</body>
</html>
